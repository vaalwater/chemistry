<title>立体几何 3D</title>

<style>
  /* 几何引擎布局：上方 3D 实体，下方 2D 直观图（split 模式下） */
  #app { display: flex; flex-direction: column; }
  #view3d { position: relative; flex: 1 1 auto; min-height: 0; }
  #view3d canvas { position: absolute; left: 0; top: 0; }
  #panel2d {
    position: relative; flex: 0 0 44%; display: none;
    align-items: center; justify-content: center;
    border-top: 1px solid #e3ebf5;
    background: rgba(255, 255, 255, 0.5);
  }
  #app.split #view3d { flex: 0 0 56%; }
  #app.split #panel2d { display: flex; }
  #panel2d canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <div id="app">
    <div id="view3d"></div>
    <div id="panel2d"></div>
  </div>

      </div>
      <div class="boot-title">立体几何空间</div>
      <div class="boot-sub">正在准备几何体…</div>
    </div>
  </div>
